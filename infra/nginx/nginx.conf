# Load balancer: distributes requests between the API replicas (round robin).
events {}
http {
  upstream copilot_api {
    server api:8000;          # Docker DNS resolves "api" to every replica
  }
  server {
    listen 80;
    location / {
      proxy_pass http://copilot_api;
      proxy_read_timeout 120s;    # LLM calls can be slow
      proxy_set_header X-Request-ID $request_id;
    }
  }
}
